<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1380" viewBox="0 0 850 1380"><defs><marker id="arr0" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#496779"/></marker><marker id="arr1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B7473E"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#315A7D"/></marker><marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#23756E"/></marker></defs><rect x="0" y="0" width="850" height="1380" fill="#FFFFFF"/><text x="425.0" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B3A" text-anchor="middle">Конвейер подготовки данных и прогнозирования оттока</text><path d="M 425.0,132 L 425.0,150" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 425.0,220 L 425.0,240" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 425.0,302 L 425.0,320" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 425.0,382 L 425.0,400" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 425.0,470 L 425.0,485" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 425.0,567 L 425.0,590" fill="none" stroke="#496779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 510,526 L 655,526" fill="none" stroke="#B7473E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr1)"/><rect x="553.0" y="500" width="54" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="580" y="516" font-family="Arial,sans-serif" font-size="13" fill="#314B5B" text-anchor="middle" font-weight="400">нет</text><path d="M 390,668 L 390,690 L 223,690 L 223,748" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><rect x="255.88" y="669" width="68.24000000000001" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="290" y="685" font-family="Arial,sans-serif" font-size="13" fill="#314B5B" text-anchor="middle" font-weight="400">обучение</text><path d="M 460,668 L 460,690 L 627,690 L 627,748" fill="none" stroke="#23756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr3)"/><rect x="495.4" y="669" width="119.20000000000002" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="555" y="685" font-family="Arial,sans-serif" font-size="13" fill="#314B5B" text-anchor="middle" font-weight="400">прогнозирование</text><path d="M 223,830 L 223,842" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 223,914 L 223,928" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 223,1010 L 223,1024" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 223,1089 L 223,1101" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 223,1166 L 223,1178" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 223,1248 L 223,1260" fill="none" stroke="#315A7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr2)"/><path d="M 627,814 L 627,828" fill="none" stroke="#23756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr3)"/><path d="M 627,906 L 627,920" fill="none" stroke="#23756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr3)"/><path d="M 627,998 L 627,1012" fill="none" stroke="#23756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr3)"/><path d="M 627,1090 L 627,1104" fill="none" stroke="#23756E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr3)"/><rect x="215" y="70" width="420" height="62" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="425.0" y="96.5" font-family="Arial,sans-serif" font-size="15" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">1. Конфигурация запуска</tspan><tspan x="425.0" dy="19.2">seed = 42; пути; схема признаков</tspan></text><rect x="195" y="150" width="460" height="70" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="425.0" y="180.5" font-family="Arial,sans-serif" font-size="15" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">2. Проверить SHA-256, состав и порядок</tspan><tspan x="425.0" dy="19.2">столбцов исходного CSV</tspan></text><rect x="215" y="240" width="420" height="62" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="425.0" y="266.5" font-family="Arial,sans-serif" font-size="15" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">3. Загрузить initial_60.csv</tspan><tspan x="425.0" dy="19.2">или очередной incoming-пакет</tspan></text><rect x="215" y="320" width="420" height="62" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="425.0" y="346.5" font-family="Arial,sans-serif" font-size="15" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">4. Нормализовать пустые строки</tspan><tspan x="425.0" dy="19.2">и привести типы данных</tspan></text><rect x="195" y="400" width="460" height="70" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="425.0" y="430.5" font-family="Arial,sans-serif" font-size="15" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">5. Проверить схему, customerID, дубликаты,</tspan><tspan x="425.0" dy="19.2">категории и числовые диапазоны</tspan></text><polygon points="425.0,485 510,526.0 425.0,567 340,526.0" fill="#FFF1CC" stroke="#9A7620" stroke-width="2"/><text x="425.0" y="521.2" font-family="Arial,sans-serif" font-size="16" fill="#172B3A" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0">Данные</tspan><tspan x="425.0" dy="20.48">допущены?</tspan></text><polygon points="425.0,590 500,629.0 425.0,668 350,629.0" fill="#FFF1CC" stroke="#9A7620" stroke-width="2"/><text x="425.0" y="624.2" font-family="Arial,sans-serif" font-size="16" fill="#172B3A" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0">Режим</tspan><tspan x="425.0" dy="20.48">запуска?</tspan></text><rect x="655" y="480" width="170" height="95" rx="14" fill="#FCE8E6" stroke="#B7473E" stroke-width="2"/><text x="740.0" y="523.5999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="740.0" dy="0">Остановить обработку</tspan><tspan x="740.0" dy="16.64">и сохранить ошибку</tspan></text><rect x="28" y="705" width="390" height="635" rx="14" fill="#F5FAFE" fill-opacity="0.25" stroke="#B7D2E7" stroke-width="2"/><text x="223.0" y="1035.24" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"></text><rect x="432" y="705" width="390" height="635" rx="14" fill="#F4FBFA" fill-opacity="0.25" stroke="#B8DDD8" stroke-width="2"/><text x="627.0" y="1035.24" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"></text><text x="223.0" y="728.76" font-family="Arial,sans-serif" font-size="14" fill="#245B86" text-anchor="middle" font-weight="700"><tspan x="223.0" dy="0">ОБУЧЕНИЕ И ОЦЕНКА МОДЕЛИ</tspan></text><text x="627.0" y="728.76" font-family="Arial,sans-serif" font-size="14" fill="#23756E" text-anchor="middle" font-weight="700"><tspan x="627.0" dy="0">ПАКЕТНОЕ ПРОГНОЗИРОВАНИЕ</tspan></text><rect x="48" y="748" width="350" height="82" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="785.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">6. Отделить customerID и Churn</tspan><tspan x="223.0" dy="16.64">customerID оставить для сопоставления; Churn → y</tspan></text><rect x="48" y="842" width="350" height="72" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="874.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">7. Стратифицированно разделить данные</tspan><tspan x="223.0" dy="16.64">Train / Validation / Test; без пересечений</tspan></text><rect x="48" y="928" width="350" height="82" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="965.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">8. Создать признаки; fit преобразователей</tspan><tspan x="223.0" dy="16.64">только на Train; применить к Validation и Test</tspan></text><rect x="48" y="1024" width="350" height="65" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="1052.6000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">9. Обучить базовую и кандидатные модели</tspan><tspan x="223.0" dy="16.64">на Train</tspan></text><rect x="48" y="1101" width="350" height="65" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="1129.6000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">Выбрать модель и параметры</tspan><tspan x="223.0" dy="16.64">по результатам Validation</tspan></text><rect x="48" y="1178" width="350" height="70" rx="14" fill="#EAF2F8" stroke="#315A7D" stroke-width="2"/><text x="223.0" y="1209.1000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">Итоговая независимая оценка</tspan><tspan x="223.0" dy="16.64">выбранной модели на Test — один раз</tspan></text><rect x="48" y="1260" width="350" height="65" rx="14" fill="#E5F2E8" stroke="#4C8A5B" stroke-width="2"/><text x="223.0" y="1288.6000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="223.0" dy="0">Сохранить модель, pipeline, метрики</tspan><tspan x="223.0" dy="16.64">и конфигурацию эксперимента</tspan></text><rect x="452" y="748" width="350" height="66" rx="14" fill="#EAF2F8" stroke="#23756E" stroke-width="2"/><text x="627.0" y="777.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="627.0" dy="0">10. Загрузить сохранённые преобразователи</tspan><tspan x="627.0" dy="16.64">и обученную модель</tspan></text><rect x="452" y="828" width="350" height="78" rx="14" fill="#EAF2F8" stroke="#23756E" stroke-width="2"/><text x="627.0" y="863.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="627.0" dy="0">10. Преобразовать входящий пакет</tspan><tspan x="627.0" dy="16.64">повторный fit не выполнять</tspan></text><rect x="452" y="920" width="350" height="78" rx="14" fill="#EAF2F8" stroke="#23756E" stroke-width="2"/><text x="627.0" y="955.0999999999999" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="627.0" dy="0">10. Получить класс и вероятность оттока</tspan><tspan x="627.0" dy="16.64">customerID — только для сопоставления</tspan></text><rect x="452" y="1012" width="350" height="78" rx="14" fill="#EAF2F8" stroke="#23756E" stroke-width="2"/><text x="627.0" y="1047.1000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="627.0" dy="0">10. Сохранить прогнозы и журнал</tspan><tspan x="627.0" dy="16.64">Churn не включать в матрицу признаков</tspan></text><rect x="452" y="1104" width="350" height="92" rx="14" fill="#E5F2E8" stroke="#4C8A5B" stroke-width="2"/><text x="627.0" y="1146.1000000000001" font-family="Arial,sans-serif" font-size="13" fill="#172B3A" text-anchor="middle" font-weight="400"><tspan x="627.0" dy="0">11. После поступления фактического Churn</tspan><tspan x="627.0" dy="16.64">сопоставить метки и рассчитать метрики</tspan></text></svg>