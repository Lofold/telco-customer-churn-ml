<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1810" viewBox="0 0 1300 1810">
<title>Конвейер подготовки данных и прогнозирования оттока — Train, Validation, Test</title>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#496779"/></marker>
<style>
.edge{fill:none;stroke:#496779;stroke-width:2.2;marker-end:url(#arrow)}
.process{fill:#EAF2F8;stroke:#315A7D;stroke-width:2.6}
.decision{fill:#FFF1CC;stroke:#9A7620;stroke-width:2.6}
.error{fill:#FCE8E6;stroke:#A33D35;stroke-width:2.6}
.label{font-family:Arial,sans-serif;fill:#172B3A;text-anchor:middle;font-size:19px}
.small{font-family:Arial,sans-serif;fill:#314B5B;text-anchor:middle;font-size:17px}
.title{font-family:Arial,sans-serif;fill:#172B3A;text-anchor:middle;font-size:30px}
</style>
</defs>
<rect width="1300" height="1810" fill="#fff"/>
<text class="title" x="650" y="42">Конвейер подготовки данных и прогнозирования оттока</text>
<path class="edge" d="M650 78 V100 M650 172 V200 M650 272 V285 M650 375 V390 M650 462 V485 M650 557 V580 M650 652 V665 M650 755 V790"/>
<text class="small" x="672" y="778">да</text>
<path class="edge" d="M550 835 L550 885 L305 885 L305 930 M750 835 L750 885 L995 885 L995 930"/>
<text class="small" x="405" y="878">обучение</text><text class="small" x="895" y="878">прогнозирование</text>
<path class="edge" d="M305 1022 V1045 M305 1150 V1175 M305 1255 V1270 M305 1350 V1365 M305 1460 V1475 M305 1555 V1580"/>
<path class="edge" d="M995 1010 V1025 M995 1105 V1120 M995 1200 V1215 M995 1303 V1320 M995 1408 V1440"/>
<path class="edge" d="M745 330 H1280 V1685 H870 M745 710 H1250 V1685 H870"/>
<text class="small" x="1245" y="315">нет</text><text class="small" x="1215" y="695">нет</text>
<path class="edge" d="M650 1730 V1750"/>
<circle cx="650" cy="70" r="9" fill="#315A7D"/>
<rect class="process" x="400" y="100" width="500" height="72" rx="17"/>
<text class="label" x="650" y="130"><tspan x="650">1. Загрузить конфигурацию</tspan><tspan x="650" dy="24">seed = 42; пути; схема признаков</tspan></text>
<rect class="process" x="400" y="200" width="500" height="72" rx="17"/>
<text class="label" x="650" y="230"><tspan x="650">2. Проверить SHA-256 и схему</tspan><tspan x="650" dy="24">неизменяемого исходного CSV</tspan></text>
<polygon class="decision" points="650,285 745,330 650,375 555,330"/>
<text class="label" x="650" y="324"><tspan x="650">Источник</tspan><tspan x="650" dy="23">корректен?</tspan></text>
<rect class="process" x="400" y="390" width="500" height="72" rx="17"/>
<text class="label" x="650" y="420"><tspan x="650">3. Загрузить initial_60 или</tspan><tspan x="650" dy="24">очередной incoming-пакет</tspan></text>
<rect class="process" x="400" y="485" width="500" height="72" rx="17"/>
<text class="label" x="650" y="515"><tspan x="650">4. Нормализовать значения</tspan><tspan x="650" dy="24">пустые строки → пропуски; типы</tspan></text>
<rect class="process" x="400" y="580" width="500" height="72" rx="17"/>
<text class="label" x="650" y="610"><tspan x="650">5. Проверить качество данных</tspan><tspan x="650" dy="24">схема, ID, категории, диапазоны</tspan></text>
<polygon class="decision" points="650,665 745,710 650,755 555,710"/>
<text class="label" x="650" y="704"><tspan x="650">Проверки</tspan><tspan x="650" dy="23">пройдены?</tspan></text>
<polygon class="decision" points="650,790 760,835 650,880 540,835"/>
<text class="label" x="650" y="829"><tspan x="650">Режим</tspan><tspan x="650" dy="23">запуска?</tspan></text>
<rect class="process" x="30" y="930" width="550" height="92" rx="17"/>
<text class="label" x="305" y="958"><tspan x="305">6–7. Отделить customerID и Churn;</tspan><tspan x="305" dy="23">стратифицированно разделить X и y на</tspan><tspan x="305" dy="23">Train / Validation / Test (70 / 15 / 15)</tspan></text>
<rect class="process" x="30" y="1045" width="550" height="105" rx="17"/>
<text class="label" x="305" y="1073"><tspan x="305">8. Сформировать признаки; fit импутера,</tspan><tspan x="305" dy="23">энкодера и скейлера только на Train;</tspan><tspan x="305" dy="23">transform всех трёх выборок без повторного fit</tspan></text>
<rect class="process" x="30" y="1175" width="550" height="80" rx="17"/>
<text class="label" x="305" y="1205"><tspan x="305">9. Обучить базовую и кандидатные</tspan><tspan x="305" dy="24">модели на Train</tspan></text>
<rect class="process" x="30" y="1270" width="550" height="80" rx="17"/>
<text class="label" x="305" y="1300"><tspan x="305">Сравнить модели и выбрать параметры</tspan><tspan x="305" dy="24">по результатам Validation</tspan></text>
<rect class="process" x="30" y="1365" width="550" height="95" rx="17"/>
<text class="label" x="305" y="1394"><tspan x="305">Итоговая независимая оценка</tspan><tspan x="305" dy="24">выбранной модели на Test;</tspan><tspan x="305" dy="24">не использовать Test для настройки</tspan></text>
<rect class="process" x="30" y="1475" width="550" height="80" rx="17"/>
<text class="label" x="305" y="1505"><tspan x="305">Сохранить модель, преобразователи,</tspan><tspan x="305" dy="24">метрики и конфигурацию эксперимента</tspan></text>
<circle cx="305" cy="1590" r="14" fill="none" stroke="#315A7D" stroke-width="3"/><circle cx="305" cy="1590" r="7" fill="#315A7D"/>
<rect class="process" x="720" y="930" width="550" height="80" rx="17"/>
<text class="label" x="995" y="960"><tspan x="995">Загрузить сохранённые</tspan><tspan x="995" dy="24">преобразования и модель</tspan></text>
<rect class="process" x="720" y="1025" width="550" height="80" rx="17"/>
<text class="label" x="995" y="1055"><tspan x="995">Применить те же преобразования</tspan><tspan x="995" dy="24">к incoming-пакету</tspan></text>
<rect class="process" x="720" y="1120" width="550" height="80" rx="17"/>
<text class="label" x="995" y="1150"><tspan x="995">Получить класс и вероятность</tspan><tspan x="995" dy="24">оттока для каждой записи</tspan></text>
<rect class="process" x="720" y="1215" width="550" height="88" rx="17"/>
<text class="label" x="995" y="1245"><tspan x="995">Сохранить прогнозы и журнал;</tspan><tspan x="995" dy="24">фактический Churn не использовать</tspan><tspan x="995" dy="23">как входной признак</tspan></text>
<rect class="process" x="720" y="1320" width="550" height="88" rx="17"/>
<text class="label" x="995" y="1350"><tspan x="995">Оценить качество после поступления</tspan><tspan x="995" dy="24">фактических меток Churn, если доступны</tspan></text>
<circle cx="995" cy="1455" r="14" fill="none" stroke="#315A7D" stroke-width="3"/><circle cx="995" cy="1455" r="7" fill="#315A7D"/>
<rect class="error" x="430" y="1640" width="440" height="90" rx="17"/>
<text class="label" x="650" y="1674"><tspan x="650">Сохранить диагностику; остановить</tspan><tspan x="650" dy="24">обработку / изолировать ошибочный пакет</tspan></text>
<circle cx="650" cy="1765" r="14" fill="none" stroke="#315A7D" stroke-width="3"/><circle cx="650" cy="1765" r="7" fill="#315A7D"/>
</svg>