<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2520" viewBox="0 0 520 2520"><defs><marker id="arr0" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#1D5E91"/></marker></defs><rect x="0" y="0" width="520" height="2520" fill="#FFFFFF"/><text x="260.0" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B3A" text-anchor="middle">Архитектура системы</text><path d="M 260,240 L 260,290" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,495 L 260,545" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,750 L 260,800" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,980 L 260,1030" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,1160 L 260,1210" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,1385 L 260,1435" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,1610 L 260,1660" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,1790 L 260,1840" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,1965 L 260,2015" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><path d="M 260,2180 L 260,2230" fill="none" stroke="#1D5E91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr0)"/><rect x="40" y="85" width="440" height="155" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="157.1" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Исходные данные</tspan><tspan x="260.0" dy="23.04">Telco Customer Churn (CSV)</tspan></text><rect x="40" y="290" width="440" height="205" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="352.54" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Проверка качества данных</tspan><tspan x="260.0" dy="23.04">• пропуски</tspan><tspan x="260.0" dy="23.04">• дубликаты</tspan><tspan x="260.0" dy="23.04">• типы данных</tspan><tspan x="260.0" dy="23.04">• выбросы и ошибки</tspan></text><rect x="40" y="545" width="440" height="205" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="619.0600000000001" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Предварительная обработка</tspan><tspan x="260.0" dy="23.04">• очистка данных</tspan><tspan x="260.0" dy="23.04">• кодирование категорий</tspan><tspan x="260.0" dy="23.04">• обработка числовых признаков</tspan></text><rect x="40" y="800" width="440" height="180" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="861.5600000000001" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Разведочный анализ (EDA)</tspan><tspan x="260.0" dy="23.04">• распределения</tspan><tspan x="260.0" dy="23.04">• взаимосвязи признаков</tspan><tspan x="260.0" dy="23.04">• анализ Churn</tspan></text><rect x="40" y="1030" width="440" height="130" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="1089.6" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Формирование выборок</tspan><tspan x="260.0" dy="23.04">Train / Validation / Test</tspan></text><rect x="40" y="1210" width="440" height="175" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="1280.58" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Обучение ML-моделей</tspan><tspan x="260.0" dy="23.04">• классификация</tspan><tspan x="260.0" dy="23.04">• подбор гиперпараметров по Validation</tspan></text><rect x="40" y="1435" width="440" height="175" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="1517.1" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Итоговая оценка качества</tspan><tspan x="260.0" dy="23.04">на Test: Precision / Recall / F1 / ROC-AUC</tspan></text><rect x="40" y="1660" width="440" height="130" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="1719.6" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Итоговая ML-модель</tspan><tspan x="260.0" dy="23.04">обученный pipeline + модель</tspan></text><rect x="40" y="1840" width="440" height="125" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="1897.1" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Новые данные клиентов</tspan><tspan x="260.0" dy="23.04">incoming batch</tspan></text><rect x="40" y="2015" width="440" height="165" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="2080.58" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Прогнозирование</tspan><tspan x="260.0" dy="23.04">• класс Churn</tspan><tspan x="260.0" dy="23.04">• вероятность оттока</tspan></text><rect x="40" y="2230" width="440" height="175" rx="18" fill="#07345B" stroke="#6FA5CF" stroke-width="2"/><text x="260.0" y="2300.58" font-family="Arial,sans-serif" font-size="18" fill="#D6E9FA" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0">Бизнес-результат</tspan><tspan x="260.0" dy="23.04">Выделение клиентов с</tspan><tspan x="260.0" dy="23.04">высоким риском оттока</tspan></text></svg>